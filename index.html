<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050a24" />

    <!-- Stable on purpose: no matchday number, so the title Google shows doesn't churn every fortnight.
         The upcoming matchday goes in the description and <noscript> instead: their placeholders are
         filled in at build time by stampNextMatchdayHtml in vite.config.js. -->
    <title>UCL FDR &amp; Fixture Ticker – Champions League Fixture Difficulty</title>
    <meta
      name="description"
      content="UCL Fantasy fixture ticker and Champions League fixture difficulty for all 36 teams, MD1–MD8: best fixture runs and teams' fixtures side by side.__NEXT_UP__"
    />
    <link rel="canonical" href="https://ucl-fdr.vercel.app/" />

    <!-- Link previews. Without these an X post renders as a bare URL with no
         card, which is most of the reason a good tool gets scrolled past. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UCL FDR" />
    <meta property="og:url" content="https://ucl-fdr.vercel.app/" />
    <meta property="og:title" content="UCL FDR &amp; Fixture Ticker — every Champions League fixture, rated" />
    <meta
      property="og:description"
      content="Fixture difficulty for all 36 Champions League teams, MD1–MD8: a fixture ticker, the best fixture runs and teams' fixtures side by side. Free for UCL Fantasy."
    />
    <meta property="og:image" content="https://ucl-fdr.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="UCL FDR fixture difficulty grid for the Champions League league phase" />
    <meta property="og:locale" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@fpl_proleague" />
    <meta name="twitter:creator" content="@fpl_proleague" />
    <meta name="twitter:title" content="UCL FDR &amp; Fixture Ticker — every Champions League fixture, rated" />
    <meta
      name="twitter:description"
      content="Fixture ticker and fixture difficulty for all 36 UCL teams, MD1–MD8. Best fixture runs and side-by-side comparison. Free UCL Fantasy planner."
    />
    <meta name="twitter:image" content="https://ucl-fdr.vercel.app/og-image.jpg" />

    <link rel="icon" type="image/png" href="/ucl-icon.png" />
    <link rel="apple-touch-icon" href="/ucl-icon.png" />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "UCL FDR",
        "url": "https://ucl-fdr.vercel.app/",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any",
        "description": "Champions League fixture difficulty ratings and fixture ticker for all 36 UEFA Champions League league-phase teams, MD1–MD8: the best fixture runs, teams' fixtures compared side by side, and team strength you can adjust. Built for UCL Fantasy.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>UCL FDR &amp; Fixture Ticker — Champions League Fixture Difficulty</h1>
      <p>
        A fixture ticker and fixture difficulty ratings for all 36 teams in the 2026/27 UEFA Champions League league
        phase, matchday 1 to matchday 8 (MD1–MD8). Set your own 1–5 strength rating for every team, find the best
        fixture runs, and compare teams' fixtures side by side. Built for UCL Fantasy managers by
        <a href="https://x.com/fpl_proleague">@fpl_proleague</a>.
      </p>

      <p>

        <a href="/md/8/">MD8</a>

    <script type="module" src="/src/main.jsx"></script>
